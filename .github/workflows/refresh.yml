name: Dota 2 Data Refresh

on:
  schedule:
    - cron: '17 6 * * 1'   # 6:17 AM UTC every Monday
  workflow_dispatch:        # lets you trigger it manually from the Actions tab, for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ingestion\requirements.txt

      - name: Run refresh script
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python ingestion\refresh.py